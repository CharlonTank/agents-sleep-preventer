name: Install script

# The Linux install script from the website, against the latest release, run
# the way the site tells people to: download it, then run it.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Install from the website
        run: |
          curl -fsSL https://asp.charlon.dev/install.sh -o install.sh
          sh install.sh | tee install.log
          grep -q "SHA-256 checked" install.log
      - name: Use it
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          asp --version
          asp monitor status
          asp monitor watch --max 1 || test $? -eq 3
          asp telegram sessions 2>&1 | grep -q "setup" || asp telegram sessions
